{{define "content"}}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">

    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="text-xl font-semibold tracking-tight">{{tr .Langue "login.titre"}}</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "login.sous_titre"}}</p>
      </div>
      <span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-medium text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300">
        v{{.Version}}
      </span>
    </div>

    <form method="post" action="/login" class="mt-6 space-y-4"
          hx-post="/login" hx-target="#erreurs" hx-swap="innerHTML">

      <div>
        <label for="domaine" class="block text-sm font-medium">{{tr .Langue "login.domaine"}}</label>
        <input id="domaine" name="domaine" type="text" required autocomplete="organization"
               placeholder="EDUSYNC.LOCAL"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-indigo-900">
      </div>

      <div>
        <label for="controleur" class="block text-sm font-medium">{{tr .Langue "login.controleur"}}</label>
        <input id="controleur" name="controleur" type="text" required autocomplete="off"
               placeholder="dc1.edusync.local"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-indigo-900">
      </div>

      <div>
        <label for="utilisateur" class="block text-sm font-medium">{{tr .Langue "login.utilisateur"}}</label>
        <input id="utilisateur" name="utilisateur" type="text" required autocomplete="username"
               placeholder="Administrator"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-indigo-900">
      </div>

      <div>
        <label for="motdepasse" class="block text-sm font-medium">{{tr .Langue "login.mdp"}}</label>
        <input id="motdepasse" name="motdepasse" type="password" autocomplete="current-password"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-700 dark:bg-slate-800 dark:focus:ring-indigo-900">
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
        <label for="remember" class="text-sm text-slate-600 dark:text-slate-300">{{tr .Langue "login.memoriser"}}</label>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="skip_verify" name="skip_verify" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
        <label for="skip_verify" class="text-sm text-slate-600 dark:text-slate-300">{{tr .Langue "login.skip_verify"}}</label>
      </div>

      <div id="erreurs" role="alert" aria-live="polite"></div>

      <button type="submit"
              class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300">
        {{tr .Langue "login.action"}}
      </button>
    </form>

    <p class="mt-4 text-xs text-slate-500 dark:text-slate-400">{{tr .Langue "login.exemple"}}</p>
  </div>
</div>
{{end}}
