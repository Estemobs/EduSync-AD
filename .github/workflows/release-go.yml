name: Release Go (v0.*)

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

env:
  APP_NAME: edusync-ad
  CLI_NAME: edusync-cli

jobs:
  # ─── Build CLI (5 cibles, pur Go, CGO_ENABLED=0) ──────────────────────
  build-cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux   goarch: amd64
          - goos: linux   goarch: arm64
          - goos: windows goarch: amd64
          - goos: darwin  goarch: amd64
          - goos: darwin  goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Récupérer la version depuis le tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Définir le suffixe d'exécutable
        id: suffix
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then echo "exe=.exe" >> $GITHUB_OUTPUT; else echo "exe=" >> $GITHUB_OUTPUT; fi

      - name: Compiler la CLI
        run: |
          SUFFIX="${{ steps.suffix.outputs.exe }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/${CLI_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}" \
            ./cmd/edusync-cli

      - name: Calculer le hash SHA-256 (CLI)
        run: |
          SUFFIX="${{ steps.suffix.outputs.exe }}"
          sha256sum "dist/${CLI_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}" \
            | cut -d ' ' -f1 > "dist/${CLI_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${CLI_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ steps.suffix.outputs.exe }}
            dist/${CLI_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ steps.suffix.outputs.exe }}.sha256

  # ─── Build Desktop Windows (Inno Setup) ───────────────────────────────
  build-windows-desktop:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Récupérer la version depuis le tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Installer Inno Setup 6
        run: |
          # Inno Setup est préinstallé sur windows-latest (C:\Program Files (x86)\Inno Setup 6\ISCC.exe)
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Error "Inno Setup 6 introuvable sur ce runner"
            exit 1
          }
          Write-Host "Inno Setup 6 détecté"

      - name: Compiler l'application desktop (Wails v3 / go build)
        shell: pwsh
        run: |
          # WebView2 est présent sur Windows 10/11 (runner) ; mingw-w64 est disponible pour cgo.
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" `
            -o "dist\${env:APP_NAME}.exe" `
            ./cmd/edusync-ad

      - name: Construire l'installeur Inno Setup
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" build/inno/installer.iss

      - name: Calculer le hash SHA-256 (Setup.exe)
        shell: pwsh
        run: |
          (Get-FileHash EduSyncAD-Setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline EduSyncAD-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            EduSyncAD-Setup.exe
            EduSyncAD-Setup.exe.sha256

  # ─── Build Desktop Linux (AppImage + tar.gz) ──────────────────────────
  build-linux-desktop:
    name: Desktop Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Récupérer la version depuis le tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Installer les dépendances système (WebKitGTK pour Wails)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Compiler l'application desktop (Wails v3 / go build)
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/${APP_NAME}" \
            ./cmd/edusync-ad

      - name: Construire le tar.gz Linux
        run: |
          mkdir -p dist/linux-pkg
          cp dist/${APP_NAME} dist/linux-pkg/
          cat > dist/linux-pkg/${APP_NAME}.desktop <<EOF
          [Desktop Entry]
          Name=EduSync AD
          Exec=${APP_NAME}
          Icon=edusync-ad
          Type=Application
          Categories=Office;System;
          EOF
          tar -czf dist/${APP_NAME}-linux-amd64.tar.gz -C dist/linux-pkg .

      - name: Calculer le hash SHA-256 (tar.gz)
        run: |
          sha256sum dist/${APP_NAME}-linux-amd64.tar.gz | cut -d ' ' -f1 > dist/${APP_NAME}-linux-amd64.tar.gz.sha256

      - name: Construire l'AppImage Linux
        run: |
          # AppImage nécessite AppImageTool et le runtime WebKitGTK bundlé.
          # Pour simplifier l'alpha, on produit un AppImage minimal regroupant le binaire.
          sudo apt-get install -y appimagetool || true
          if command -v appimagetool >/dev/null 2>&1; then
            mkdir -p dist/AppDir/usr/bin
            cp dist/${APP_NAME} dist/AppDir/usr/bin/
            cat > dist/AppDir/usr/share/applications/${APP_NAME}.desktop <<EOF
            [Desktop Entry]
            Name=EduSync AD
            Exec=${APP_NAME}
            Icon=edusync-ad
            Type=Application
            Categories=Office;System;
            EOF
            cd dist/AppDir
            appimagetool . ../${APP_NAME}-linux.AppImage
            cd ../..
          else
            echo "appimagetool indisponible : AppImage ignoré (tar.gz produit quand même)"
          fi

      - name: Calculer le hash SHA-256 (AppImage)
        if: success()
        run: |
          sha256sum dist/${APP_NAME}-linux.AppImage | cut -d ' ' -f1 > dist/${APP_NAME}-linux.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/${APP_NAME}-linux-amd64.tar.gz
            dist/${APP_NAME}-linux-amd64.tar.gz.sha256
            dist/${APP_NAME}-linux.AppImage
            dist/${APP_NAME}-linux.AppImage.sha256

  # ─── Publier la Release GitHub (pré-release) ──────────────────────────
  release:
    name: Créer la Release
    needs: [build-cli, build-windows-desktop, build-linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Récupérer la version depuis le tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extraire le changelog alpha
        run: |
          {
            echo "## EduSync AD ${{ github.ref_name }} — Alpha 1"
            echo ""
            echo "Première version alpha de la réécriture Go/Wails d'EduSync-AD."
            echo ""
            echo "### Périmètre couvert (Core M1 → M11)"
            echo ""
            echo "- M1 : Création de comptes / Arrivées (import CSV, simulation, exécution)"
            echo "- M2 : Migration / Restructuration (déplacement OU, groupes auto)"
            echo "- M3 : Gestion des départs (désactivation, archivage, purge planifiée)"
            echo "- M4 : Réinitialisation MDP (par OU, groupe, CSV, politiques élèves/personnels)"
            echo "- M5 : Explorateur AD (arborescence, recherche unifiée)"
            echo "- M6 : Export CSV et PDF étiquettes (Avery L7160/L7163)"
            echo "- M7 : Journal d'actions (filtres, append-only SQLite)"
            echo "- M8 : Paramètres globaux (comptes, mots de passe, apparence)"
            echo "- M9 : Connexion LDAPS/LDAP (repli 389 + avertissement de sécurité)"
            echo "- M11 : Mode simulation (Validate → Simulate → Execute → Audit)"
            echo ""
            echo "### Limites connues"
            echo ""
            echo "- M10 (mise à jour intégrée) sera livrée avec la prochaine itération alpha."
            echo "- L'onglet Délégation (RBAC, M26) arrive avec les modules avancés."
            echo "- Logiciel en cours de migration : la version Python 1.17.1 reste la version de production."
            echo ""
            echo "### Installation"
            echo "- Windows : \`EduSyncAD-Setup.exe\` (Inno Setup, désinstallation propre)"
            echo "- Linux : \`EduSyncAD-linux.AppImage\` (\`chmod +x && ./EduSyncAD-linux.AppImage\`) ou \`.tar.gz\`"
            echo ""
            echo "### Vérification d'intégrité"
            echo "Les fichiers \`.sha256\` permettent de vérifier chaque artefact."
            echo ""
            echo "### Téléchargements"
            echo ""
            echo "| Plateforme | Fichier |"
            echo "|---|---|"
            echo "| Windows 10/11 | \`EduSyncAD-Setup.exe\` |"
            echo "| Linux | \`EduSyncAD-linux.AppImage\` |"
            echo "| Linux | \`edusync-ad-linux-amd64.tar.gz\` |"
            echo "| CLI (multiplateforme) | 5 binaires \`edusync-cli-<os>-<arch>\` |"
          } > release_notes.md

      - name: Créer la Release GitHub (pré-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "EduSync AD ${{ github.ref_name }} (Alpha 1)"
          body_path: release_notes.md
          draft: false
          prerelease: true
          files: |
            dist/EduSyncAD-Setup.exe
            dist/EduSyncAD-Setup.exe.sha256
            dist/EduSyncAD-linux.AppImage
            dist/EduSyncAD-linux.AppImage.sha256
            dist/edusync-ad-linux-amd64.tar.gz
            dist/edusync-ad-linux-amd64.tar.gz.sha256
