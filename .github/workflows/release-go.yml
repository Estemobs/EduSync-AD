# Workflow de release Go — EduSync-AD
# Déclenché sur les tags v0.* (ex: v0.1.0-alpha.1, v0.2.0, etc.)
# Produit : Windows Setup.exe + Linux AppImage + tar.gz + sommes SHA256
# Ne JAMAIS modifier release.yml (Python, tags v1.*) — canaux séparés.

name: Release Go (v0.*)

on:
  push:
    tags:
      - 'v0.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à construire (ex: v0.1.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: write  # pour créer la release GitHub
  attestations: read
  id-token: write

env:
  GO_VERSION: '1.27.2'
  # Version extraite du tag (ex: v0.1.0-alpha.1 -> 0.1.0-alpha.1)
  APP_VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Windows — EduSyncAD-Setup.exe (InnoSetup)
  # ═══════════════════════════════════════════════════════════════════════
  windows:
    name: Windows (Setup.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --version=6.2.2 -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build desktop (Wails)
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ env.APP_VERSION }}" -o bin/edusync-ad.exe ./cmd/edusync-ad

      - name: Prepare installer directory
        run: |
          New-Item -ItemType Directory -Force -Path build\inno\bin | Out-Null
          Copy-Item bin\edusync-ad.exe build\inno\bin\edusync-ad.exe
          Copy-Item assets\icon.ico build\inno\..\..\assets\icon.ico -ErrorAction SilentlyContinue

      - name: Build installer (InnoSetup)
        working-directory: build/inno
        run: |
          iscc /DMyAppVersion=${{ env.APP_VERSION }} installer.iss

      - name: Verify installer
        run: |
          $installer = Get-Item build\EduSyncAD-Setup.exe
          Write-Host "Installer: $($installer.FullName) - $([math]::Round($installer.Length/1MB, 1)) MB"
          if (-not $installer.Exists) { throw "Installer non trouvé" }

      - name: Generate SHA256
        run: |
          $hash = Get-FileHash -Algorithm SHA256 build\EduSyncAD-Setup.exe
          $hash.Hash | Out-File -FilePath build\EduSyncAD-Setup.exe.sha256 -Encoding ascii
          cat build\EduSyncAD-Setup.exe.sha256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/EduSyncAD-Setup.exe
            build/EduSyncAD-Setup.exe.sha256
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # Linux — AppImage + tar.gz
  # ═══════════════════════════════════════════════════════════════════════
  linux:
    name: Linux (AppImage + tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev gcc libc6-dev libgtk-3-dev libjpeg-dev libpng-dev imagemagick wget

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Make build script executable
        run: chmod +x build/appimage/build-appimage.sh

      - name: Build AppImage
        env:
          VERSION: ${{ env.APP_VERSION }}
          OUT_DIR: dist
        run: |
          mkdir -p dist
          ./build/appimage/build-appimage.sh

      - name: Verify artifacts
        run: |
          ls -lh dist/
          for f in dist/EduSyncAD-linux.AppImage dist/edusync-ad-linux-amd64.tar.gz; do
            if [ ! -f "$f" ]; then echo "❌ Manquant: $f"; exit 1; fi
            echo "✅ $f ($(du -h $f | cut -f1))"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/EduSyncAD-linux.AppImage
            dist/EduSyncAD-linux.AppImage.sha256
            dist/edusync-ad-linux-amd64.tar.gz
            dist/edusync-ad-linux-amd64.tar.gz.sha256
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # Release GitHub — regroupe les artefacts et crée la release
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/linux

      - name: Verify all artifacts
        run: |
          echo "=== Artifacts Windows ==="
          ls -lh artifacts/windows/
          echo "=== Artifacts Linux ==="
          ls -lh artifacts/linux/
          
          # Vérifier les fichiers requis
          required=(
            "artifacts/windows/EduSyncAD-Setup.exe"
            "artifacts/windows/EduSyncAD-Setup.exe.sha256"
            "artifacts/linux/EduSyncAD-linux.AppImage"
            "artifacts/linux/EduSyncAD-linux.AppImage.sha256"
            "artifacts/linux/edusync-ad-linux-amd64.tar.gz"
            "artifacts/linux/edusync-ad-linux-amd64.tar.gz.sha256"
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Fichier manquant: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: Generate release notes
        id: notes
        run: |
          cat <<'EOF' > release-notes.md
          # EduSync AD ${{ env.APP_VERSION }}
          
          **⚠️ Version alpha — Logiciel en cours de migration**
          
          Cette version est une **pré-release** (alpha) de la réécriture Go/Wails d'EduSync-AD.
          La version de production reste **Python 1.17.1**.
          
          ## Périmètre couvert (Core M1 → M11)
          
          - ✅ **Connexion AD (M9)** : LDAPS prioritaire, repli LDAP + avertissement, pool de connexions
          - ✅ **Création de comptes (M1)** : Import CSV, gabarits, doublons, groupes auto, étiquettes
          - ✅ **Réinitialisation MDP (M4)** : Par OU/groupe/CSV, politiques élèves/personnels, forçage
          - ✅ **Migration / Restructuration (M2)** : Via CSV ou UI, déplacement + groupes auto
          - ✅ **Explorateur AD (M5)** : Arborescence, recherche temps réel, détails
          - ✅ **Export CSV/PDF (M6)** : Sélection OU ± sous-OU, champs cochables, PDF Avery + QR
          - ✅ **Journal d'actions (M7)** : Filtres date/type/résultat, export CSV, SQLite append-only
          - ✅ **Gestion des départs (M3)** : Désactivation, archivage, purge planifiée
          - ✅ **Paramètres globaux (M8)** : 3 onglets (comptes, MDP, apparence)
          - ✅ **Mode simulation (M11)** : Validate → Simulate → Execute → Audit sur tout le Core
          - ✅ **Mise à jour intégrée (M10)** : Vérification GitHub releases, SHA-256, installation
          
          ## Formats de distribution
          
          | Plateforme | Fichier | Installation |
          |---|---|---|
          | Windows 10/11 (x64) | `EduSyncAD-Setup.exe` | Exécuter en admin |
          | Linux (x64, AppImage) | `EduSyncAD-linux.AppImage` | `chmod +x` puis exécuter |
          | Linux (x64, binaire) | `edusync-ad-linux-amd64.tar.gz` | Extraire, `./edusync-ad` |
          
          Chaque artefact est accompagné de son fichier `.sha256` pour vérification.
          
          ## Vérification des sommes
          
          ```bash
          # Windows (PowerShell)
          Get-FileHash -Algorithm SHA256 EduSyncAD-Setup.exe
          
          # Linux
          sha256sum -c EduSyncAD-linux.AppImage.sha256
          sha256sum -c edusync-ad-linux-amd64.tar.gz.sha256
          ```
          
          ## Limitations connues (alpha)
          
          - Pas encore de tests d'intégration automatisés contre un vrai AD (campagne Priorité 3)
          - Pas de module avancé (M12+) — livrés un par release ensuite
          - Taille desktop ~17 MB (cible < 15 MB, optimisation prévue)
          - macOS non supporté dans cette alpha
          
          ## Retour à la version Python
          
          La version Python 1.17.1 reste la version de production recommandée.
          Pour migrer vos données vers Go : `edusync-cli migrate --from-python` (à venir).
          
          ---
          
          **Appel à testeurs** : Merci de tester la connexion LDAPS, la création de comptes,
          la réinitialisation MDP, l'explorateur, l'export et le journal.
          Rapportez les problèmes sur GitHub Issues.
          EOF
          
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: EduSync AD ${{ env.APP_VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          files: |
            artifacts/windows/EduSyncAD-Setup.exe
            artifacts/windows/EduSyncAD-Setup.exe.sha256
            artifacts/linux/EduSyncAD-linux.AppImage
            artifacts/linux/EduSyncAD-linux.AppImage.sha256
            artifacts/linux/edusync-ad-linux-amd64.tar.gz
            artifacts/linux/edusync-ad-linux-amd64.tar.gz.sha256