# Release Go (tags v0.*) — EduSync AD
# Ne modifie PAS release.yml (Python, tags v1.*)
# Déclencheur : git tag v0.x.x-alpha.x && git push origin v0.x.x-alpha.x

name: Release Go (Alpha)

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write  # pour créer la release GitHub

env:
  GO_VERSION: '1.27'
  APP_NAME: 'edusync-ad'
  VERSION: ${{ github.ref_name }}

jobs:
  # ─── Job Windows : wails build + InnoSetup ───────────────────────────────
  windows:
    name: Windows (Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --version 6.2.2
          echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH

      - name: Build binaire Windows (wails build)
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails@latest
          wails build -platform windows/amd64 -ldflags "-s -w -X main.version=${{ env.VERSION }}"

      - name: Générer Setup.exe avec InnoSetup
        run: |
          # Copier le binaire généré par wails
          mkdir -p build/inno/bin
          cp build/bin/edusync-ad.exe build/inno/bin/
          # Créer un ICO minimal depuis le SVG (fallback si pas d'icon.ico)
          if [ ! -f assets/icon.ico ]; then
            cat > build/inno/icon.ico <<'ICOEOF'
            # Minimal ICO placeholder - à remplacer par un vrai icon.ico
            # Pour l'instant, InnoSetup utilisera l'icône par défaut de Windows
            ICOEOF
          else
            cp assets/icon.ico build/inno/
          fi
          # Compiler l'installateur
          iscc /DMyAppVersion=${{ env.VERSION }} build/inno/installer.iss

      - name: SHA256 Setup.exe
        run: |
          cd dist
          sha256sum EduSyncAD-Setup.exe > EduSyncAD-Setup.exe.sha256

      - name: Upload artefacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/EduSyncAD-Setup.exe
            dist/EduSyncAD-Setup.exe.sha256

  # ─── Job Linux : AppImage + tar.gz ───────────────────────────────────────
  linux:
    name: Linux (AppImage + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-4-dev libsoup-3.0-dev \
            libglib2.0-dev libgdk-pixbuf-2.0-dev libc6-dev gcc make pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binaire + AppImage + tar.gz
        run: |
          chmod +x build/appimage/build-appimage.sh
          ./build/appimage/build-appimage.sh "${{ env.VERSION }}"

      - name: Upload artefacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/EduSyncAD-linux.AppImage
            dist/EduSyncAD-linux.AppImage.sha256
            dist/edusync-ad-linux-amd64.tar.gz
            dist/edusync-ad-linux-amd64.tar.gz.sha256

  # ─── Job Release : créer la release GitHub ───────────────────────────────
  release:
    name: Créer Release GitHub
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artefacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Download Linux artefacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/

      - name: Générer notes de version
        id: notes
        run: |
          cat <<'EOF' > release-notes.md
          # EduSync AD ${{ env.VERSION }} (Alpha)

          ⚠️ **Version alpha — logiciel en cours de migration**
          La version de production reste **1.17.1 (Python/PyQt6)**.

          ## Périmètre couvert (Core M1 → M11)
          - ✅ M1 — Création de comptes (import CSV, simulation, exécution, groupes auto, étiquettes)
          - ✅ M2 — Migration / restructuration (plan CSV, simulation, exécution, groupes classe)
          - ✅ M3 — Gestion des départs (immédiat, différé + purge planifiée, restauration)
          - ✅ M4 — Réinitialisation MDP (OU, groupe, CSV, politiques élèves/personnel)
          - ✅ M5 — Explorateur AD (arbre, recherche temps réel, détails user/groupe/OU)
          - ✅ M6 — Export CSV / PDF étiquettes (Avery L7160/L7163) / Trombinoscope
          - ✅ M7 — Journal d'actions (filtres, export CSV, SQLite append-only)
          - ✅ M8 — Paramètres globaux (comptes, MDP, thème/ langue)
          - ✅ M9 — Connexion LDAPS/LDAP (pool, SASL/GSSAPI, fallback LDAP 389)
          - ✅ M10 — Mise à jour intégrée (GitHub releases, SHA-256)
          - ✅ M11 — Mode simulation + progression/annulation (Validate→Simulate→Execute→Audit)

          ## Installation
          - **Windows** : `EduSyncAD-Setup.exe` (InnoSetup, admin requis)
          - **Linux** : `EduSyncAD-linux.AppImage` (chmod +x + exécuter) ou `edusync-ad-linux-amd64.tar.gz`

          ## Limites connues
          - Taille desktop ~17 MB (cible < 15 MB, optimisation prévue)
          - Pas encore de macOS (secondaire)
          - Modules avancés (M12 → M32) livrés un par un en releases v0.2.0+

          ## Retour d'expérience
          Ouvrez une issue sur GitHub pour tout bug ou suggestion.
          EOF

      - name: Créer la release (pré-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: EduSync AD ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: true
          files: |
            dist/EduSyncAD-Setup.exe
            dist/EduSyncAD-Setup.exe.sha256
            dist/EduSyncAD-linux.AppImage
            dist/EduSyncAD-linux.AppImage.sha256
            dist/edusync-ad-linux-amd64.tar.gz
            dist/edusync-ad-linux-amd64.tar.gz.sha256
          draft: false