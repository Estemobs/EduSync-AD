[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edusync-ad"
version = "1.14.0"
description = "Outil de gestion Active Directory pour établissements scolaires"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "ldap3>=2.9.1",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
edusync-ad = "edusync_ad.app:main"

[project.entry-points."edusync_ad.modules"]
# Modules intégrés (chargés par défaut)
create_accounts = "edusync_ad.plugins.builtin:CreateAccountsModule"
migration = "edusync_ad.plugins.builtin:MigrationModule"
depart = "edusync_ad.plugins.builtin:DepartModule"
password_reset = "edusync_ad.plugins.builtin:PasswordResetModule"
ad_explorer = "edusync_ad.plugins.builtin:ADExplorerModule"
export = "edusync_ad.plugins.builtin:ExportModule"
audit = "edusync_ad.plugins.builtin:AuditModule"
settings = "edusync_ad.plugins.builtin:SettingsModule"
profiles = "edusync_ad.plugins.builtin:ProfilesModule"
homedirs = "edusync_ad.plugins.builtin:HomeDirsModule"
quotas = "edusync_ad.plugins.builtin:QuotasModule"
logon_hours = "edusync_ad.plugins.builtin:LogonHoursModule"
logon_scripts = "edusync_ad.plugins.builtin:LogonScriptsModule"
class_spaces = "edusync_ad.plugins.builtin:ClassSpacesModule"
m365 = "edusync_ad.plugins.builtin:M365Module"
exchange = "edusync_ad.plugins.builtin:ExchangeModule"
rds = "edusync_ad.plugins.builtin:RDSModule"
advanced_io = "edusync_ad.plugins.builtin:AdvancedIOModule"
group_templates = "edusync_ad.plugins.builtin:GroupTemplatesModule"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
